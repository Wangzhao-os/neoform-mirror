name: Fetch NeoFormRuntime

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download neoform-runtime artifacts
        shell: bash
        run: |
          set -e
          BASE="https://maven.neoforged.net/releases/net/neoforged/neoform-runtime/2.0.18"
          OUT="m2/net/neoforged/neoform-runtime/2.0.18"
          mkdir -p "$OUT"
          echo "Downloading from $BASE"
          for f in \
            neoform-runtime-2.0.18.pom \
            neoform-runtime-2.0.18.jar \
            neoform-runtime-2.0.18.module; do
            echo "  -> $f"
            curl -fsSL --retry 3 "$BASE/$f" -o "$OUT/$f" || echo "     (not found, skipped)"
          done
          echo "=== Files downloaded ==="
          ls -la "$OUT"

      - name: Commit artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add neoform-runtime 2.0.18 artifacts" || echo "Nothing to commit"
          git push || echo "Push failed"
