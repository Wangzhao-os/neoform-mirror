name: Fetch NeoFormRuntime

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Resolve all neoform-runtime dependencies
        shell: bash
        run: |
          set -e
          mkdir -p proj && cd proj
          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              gradlePluginPortal()
              maven { url 'https://maven.neoforged.net/releases' }
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
              mavenCentral()
              maven { url 'https://maven.neoforged.net/releases' }
              maven { url 'https://maven.minecraftforge.net' }
              maven { url 'https://maven.fabricmc.net' }
            }
          }
          rootProject.name = 'depfetch'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'java' }
          dependencies {
            implementation 'net.neoforged:neoform-runtime:2.0.18'
          }
          tasks.register('resolveAll') {
            doLast {
              configurations.findAll { it.canBeResolved }.each { c ->
                try { c.resolve() } catch (Exception e) { println "skip ${c.name}" }
              }
            }
          }
          EOF
          gradle resolveAll --no-daemon --stacktrace 2>&1 | tail -20
          echo "=== Resolved, cache size: ==="
          du -sh "$HOME/.gradle/caches/modules-2"

      - name: Pack Gradle cache as tarball
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          tar czf gradle-cache.tar.gz -C "$HOME/.gradle/caches" modules-2
          ls -lh gradle-cache.tar.gz

      - name: Commit tarball
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f gradle-cache.tar.gz
          git commit -m "Add resolved Gradle dependency cache" || echo "Nothing to commit"
          git push || echo "Push failed"
