name: Fetch NeoFormRuntime

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all required artifacts
        shell: bash
        run: |
          set -e
          OUT="m2"
          mkdir -p "$OUT"

          fetch() {
            local base="$1" group="$2" art="$3" ver="$4"
            local gp="${group//.//}"
            local dir="$OUT/$gp/$art/$ver"
            mkdir -p "$dir"
            for ext in pom jar module; do
              local url="$base/$gp/$art/$ver/$art-$ver.$ext"
              echo "  -> $group:$art:$ver ($ext)"
              curl -fsSL --retry 3 "$url" -o "$dir/$art-$ver.$ext" 2>/dev/null || rm -f "$dir/$art-$ver.$ext"
            done
          }

          NF="https://maven.neoforged.net/releases"

          echo "=== core ==="
          fetch "$NF" net.neoforged neoform-runtime 2.0.18

          echo "=== deps from neoforged ==="
          fetch "$NF" io.codechicken DiffPatch 2.0.0.36
          fetch "$NF" net.neoforged AutoRenamingTool 2.0.17
          fetch "$NF" net.neoforged.jst jst-cli-bundle 2.0.6
          fetch "$NF" net.neoforged.installertools installertools 4.0.12
          fetch "$NF" net.neoforged srgutils 1.0.10
          fetch "$NF" net.neoforged.installertools problems-api 3.0.3

          echo "=== deps from minecraftforge ==="
          fetch "https://maven.minecraftforge.net" net.minecraftforge mergetool 1.1.7

          echo "=== deps from fabricmc ==="
          fetch "https://maven.fabricmc.net" net.fabricmc fabric-loom-native 0.2.1

          echo "=== deps from maven central ==="
          fetch "https://repo1.maven.org/maven2" info.picocli picocli 4.7.6
          fetch "https://repo1.maven.org/maven2" com.google.code.gson gson 2.10.1
          fetch "https://repo1.maven.org/maven2" org.eclipse.jdt ecj 3.42.0

          echo "=== Downloaded files ==="
          find "$OUT" -type f | sort
          echo "=== Total size ==="
          du -sh "$OUT"

      - name: Commit artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add all neoform-runtime dependencies" || echo "Nothing to commit"
          git push || echo "Push failed"
