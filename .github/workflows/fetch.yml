name: Fetch NeoFormRuntime

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Resolve full dependency tree
        shell: bash
        run: |
          set -e
          mkdir -p proj && cd proj
          cat > settings.gradle <<'EOF'
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
              mavenCentral()
              maven { url 'https://maven.neoforged.net/releases' }
              maven { url 'https://maven.minecraftforge.net' }
              maven { url 'https://maven.fabricmc.net' }
            }
          }
          rootProject.name = 'depfetch'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'java' }
          dependencies {
            implementation 'net.neoforged:neoform-runtime:2.0.18'
            runtimeOnly 'net.neoforged:neoform-runtime:2.0.18'
          }
          // Force full recursive resolution of every configuration
          tasks.register('resolveAll') {
            doLast {
              ['compileClasspath','runtimeClasspath','runtimeElements','default'].each { name ->
                def c = configurations.findByName(name)
                if (c != null && c.canBeResolved) {
                  try {
                    def files = c.resolve()
                    println "RESOLVED $name : ${files.size()} files"
                  } catch (Exception e) { println "FAIL $name : ${e.message?.take(100)}" }
                }
              }
            }
          }
          EOF
          gradle resolveAll --no-daemon 2>&1 | tail -15
          echo "=== cache size ==="
          du -sh "$HOME/.gradle/caches/modules-2"
          echo "=== artifact count ==="
          find "$HOME/.gradle/caches/modules-2/files-2.1" -name '*.jar' | wc -l

      - name: Pack Gradle cache
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          tar czf gradle-cache.tar.gz -C "$HOME/.gradle/caches" modules-2
          ls -lh gradle-cache.tar.gz

      - name: Commit tarball
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f gradle-cache.tar.gz
          git commit -m "Resolve full runtime dependency tree" || echo "Nothing to commit"
          git push || echo "Push failed"
