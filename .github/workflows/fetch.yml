name: Fetch NeoFormRuntime

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Resolve real workspace dependencies
        shell: bash
        run: |
          set -e
          cd workspace
          mkdir -p src/main packloader/src/main/java run
          gradle :packloader:dependencies --configuration neoFormRuntimeTool --no-daemon 2>&1 | tail -20 || true
          gradle :packloader:dependencies --configuration neoFormRuntimeExternalTools --no-daemon 2>&1 | tail -20 || true
          gradle :packloader:compileJava --no-daemon 2>&1 | tail -20 || true
          echo "=== cache size ==="
          du -sh "$HOME/.gradle/caches/modules-2"
          echo "=== jar count ==="
          find "$HOME/.gradle/caches/modules-2/files-2.1" -name '*.jar' | wc -l

      - name: Pack and split Gradle cache
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -f gradle-cache.tar.gz.PART*
          tar czf - -C "$HOME/.gradle/caches" modules-2 | split -b 90m - gradle-cache.tar.gz.PART
          ls -lh gradle-cache.tar.gz.PART*

      - name: Commit parts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f gradle-cache.tar.gz.PART*
          git commit -m "Add split dependency cache" || echo "Nothing to commit"
          git push || echo "Push failed"
